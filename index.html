function draw() {

  canvas.style.width = size.x + "px"; canvas.style.height = size.y + "px";

  for (const kind of [3, 2, 1]) {
    ctx.beginPath();
    for (let b = 0; b < G.nB; b++) { if (G.bk[b] !== kind) continue; const s = G.bst[b], e = G.bst[b + 1];
      ctx.moveTo(X_(G.bmx[s]), Y_(G.bmy[s])); for (let i = s + 1; i < e; i++) ctx.lineTo(X_(G.bmx[i]), Y_(G.bmy[i])); }
    if (kind === 3) { ctx.strokeStyle = THEME["map-water"]; ctx.lineWidth = Math.max(2, (z - 11) * 1.4); ctx.setLineDash([]); }
    if (kind === 2) { ctx.strokeStyle = THEME["map-rail"]; ctx.lineWidth = 1.2; ctx.setLineDash([5, 4]); }
    if (kind === 1) { ctx.strokeStyle = THEME["map-motor"]; ctx.lineWidth = Math.max(2, (z - 11) * 1.3); ctx.setLineDash([]); }

  const pad = 40 / S, vis = Core.visibleEdges(EG, vx0 - pad, vy0 - pad, vx1 + pad, vy1 + pad), isVis = e => EG.stamp[e] === EG.gen;
  const showMinor = z >= 14, wMinor = Math.max(1, (z - 13) * 1.6), wMajor = Math.max(1.6, (z - 12) * 1.9);
  const tracePts = p => { if (!p) return; ctx.moveTo(X_(p[0]), Y_(p[1])); for (let i = 2; i < p.length; i += 2) ctx.lineTo(X_(p[i]), Y_(p[i + 1])); };

    ctx.lineWidth = pass === 0 ? w + 1.5 : w; ctx.stroke();

  if (state) {
    const width = Math.max(2, Math.min(6, 1.6 + (z - 12) * 0.6));
    const adj = new Map(state.reachA.items.map(it => [it.e, it]));
    ctx.beginPath(); ctx.strokeStyle = THEME.ref; ctx.lineWidth = Math.max(1.5, width * 0.75);
    for (const it of state.reachR.items) { if (!isVis(it.e)) continue; const a = adj.get(it.e); if (a && a.a <= it.a + 1e-6 && a.b >= it.b - 1e-6) continue; tracePts(subPath(G, it.e, it.a, it.b)); }
    ctx.stroke();
    const bins = Array.from({ length: NB }, () => []);
    for (const it of state.reachA.items) if (isVis(it.e)) bins[Math.min(NB - 1, Math.floor(it.tt * NB))].push(it);
    ctx.lineWidth = width;
    bins.forEach((list, b) => { if (!list.length) return; ctx.beginPath(); ctx.strokeStyle = BIN_COLORS[b]; for (const it of list) tracePts(subPath(G, it.e, it.a, it.b)); ctx.stroke(); });

    if (showSt && z >= 16) for (let i = 0; i < POI.n; i++) {   // bocas de metro alcanzadas

      const x = X_(POI.mx[i]), y = Y_(POI.my[i]); if (x < -6 || y < -6 || x > size.x + 6 || y > size.y + 6) continue;
      ctx.globalAlpha = !state.o.avoidSteps || POI.wc[i] === 1 ? 1 : 0.35;

      ctx.lineWidth = 1.5; ctx.strokeStyle = "#15171a"; ctx.strokeRect(x - 4, y - 4, 8, 8); ctx.globalAlpha = 1;
    }
    for (let i = 0; i < POI.n; i++) {
      if (!cA.inR[i]) continue;
      const c = POI.cat[i], x = X_(POI.mx[i]), y = Y_(POI.my[i]);
      if (x < -10 || y < -10 || x > size.x + 10 || y > size.y + 10) continue;
      if (c === 6) {
        if (!showSt) continue;
        const wc = POI.wc[i]; ctx.globalAlpha = cA.usable[i] ? 1 : 0.35;
        ctx.beginPath(); ctx.arc(x, y, stR, 0, 6.2832); ctx.fillStyle = STATION_COLORS[wc]; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = "#15171a"; ctx.stroke();

        if (letter && z >= 14) { ctx.fillStyle = wc === 0 ? "#15171a" : "#fff"; ctx.font = `700 ${letter.length > 1 ? 7 : 9}px ${font}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(letter, x, y + 0.5); }

    const bw = Math.abs(Math.cos(angle)) * w + Math.abs(Math.sin(angle)) * h, bh = Math.abs(Math.sin(angle)) * w + Math.abs(Math.cos(angle)) * h;
    if (x - bw / 2 < 0 || y - bh / 2 < 0 || x + bw / 2 > size.x || y + bh / 2 > size.y || !free(x - bw / 2, y - bh / 2, bw, bh)) return;

  }
  for (const p of X.parkLabelsM) { const x = X_(p[0]), y = Y_(p[1]); if (x > 0 && y > 0 && x < size.x && y < size.y && (z >= 14 || p[3] < 20)) label(X.names[p[2]], x, y, "italic 12px " + font, THEME["map-park-label"]); }
  if (z >= 16) {
    const seen = new Set(), f = "11px " + font;
    const cand = vis.filter(e => G.en[e] && G.elen[e] > 45).sort((a, b) => G.elen[b] - G.elen[a]);

let INDEX = null, hits = [], active = -1;
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function buildIndex() {
  const seen = new Map(), out = [];
  const add = (label, kind, lon, lat) => {
    const key = kind + ":" + norm(label);
    if (seen.has(key)) return seen.get(key);
    const it = { label, n: norm(label), kind, lon, lat, len: 0 };
    seen.set(key, it); out.push(it); return it;
  };
  for (let i = 0; i < POI.n; i++) if (POI.cat[i] === 6 && POI.name[i]) add(POI.names[POI.name[i]], 0, POI.lon[i], POI.lat[i]);
  for (const p of X.parkLabels) add(X.names[p[2]], 1, p[0] / 1e5, p[1] / 1e5);
  for (let e = 0; e < G.nE; e++) {
    if (!G.en[e]) continue;
    const it = add(X.names[G.en[e]], 2, 0, 0);
    if (G.elen[e] > it.len) { it.len = G.elen[e]; const u = G.eu[e], v = G.ev[e]; it.lon = (G.lon[u] + G.lon[v]) / 2; it.lat = (G.lat[u] + G.lat[v]) / 2; }
  }

  const words = norm(q).trim().split(/\s+/).filter(Boolean);

  const res = [];
  for (const it of INDEX) {
    if (!words.every(w => it.n.includes(w))) continue;
    const i = it.n.indexOf(words[0]);
    const pos = i === 0 ? 0 : (i > 0 && /[\s\-'(]/.test(it.n[i - 1])) ? 1 : 2;
    res.push([pos, it.kind, it.n.length, it]);
  }
  res.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);

}
function renderResults() {
  const ul = $("results");
  if (!hits.length) {
    ul.innerHTML = $("q").value.trim() ? `<li aria-disabled="true"><span>${t("no_results")}</span></li>` : "";
  } else {
    ul.innerHTML = hits.map((h, i) => `<li role="option" id="opt${i}" aria-selected="${i === active}"><span>${h.label.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c])}</span><small>${t("kinds")[h.kind]}</small></li>`).join("");
  }

}

function choose(i) { const h = hits[i]; if (!h) return; $("q").value = h.label; closeResults(); goTo(h.lat, h.lon); }

    const [gBytes, xBytes, pBytes] = await Promise.all(["graph.bin.gz", "extra.json.gz", "pois.json.gz"].map(f => fetchBytes(`${id}-${f}`).then(gunzip)));

    await new Promise(r => setTimeout(r, 0));
    const g = Core.parseGraph(gBytes), x = JSON.parse(new TextDecoder().decode(xBytes)), p = Core.parsePois(JSON.parse(new TextDecoder().decode(pBytes)));
    const toRing = flat => { const m = new Float64Array(flat.length); let x0 = 1, y0 = 1, x1 = 0, y1 = 0;
      for (let i = 0; i < flat.length; i += 2) { m[i] = mercX(flat[i] / 1e5); m[i + 1] = mercY(flat[i + 1] / 1e5); x0 = Math.min(x0, m[i]); x1 = Math.max(x1, m[i]); y0 = Math.min(y0, m[i + 1]); y1 = Math.max(y1, m[i + 1]); }
      return { m, x0, y0, x1, y1 }; };
    x.parks = x.parks.map(toRing); x.water = x.water.map(toRing);
    x.parkLabelsM = x.parkLabels.map((q, i) => [mercX(q[0] / 1e5), mercY(q[1] / 1e5), q[2], i]);
    D = { G: g, EG: Core.buildEdgeGrid(g), X: x, POI: p };
    CACHE.set(id, D);
  }
  ({ G, EG, X, POI } = D); INDEX = null; SUBCAT = null; state = null;
  HAS_ST = POI.cat.some(c => c === 6);
  if (X.date) { const [y, m, d] = X.date.split("-"); DATA_DATE = `${d}/${m}/${y}`; }
  const [W, S, E, N] = X.bbox;
  map.setMaxBounds(null);
  let h = { hasPlace: false };
  if (fromHash) h = applyHash();
  if (!h.hasPlace) origin = L.latLng(X.start[0], X.start[1]);
  marker.setLatLng(origin);
  map.setView(origin, h.zoom || X.zoom || 15, { animate: false });
  map.setMaxBounds([[S - 0.02, W - 0.03], [N + 0.02, E + 0.03]]);
  if (!h.hasPlace) fitNext = true;
  lastStatus = null; setStatus("");
  applyLang();
}
(async function load() {
  try {
    try { const r = await fetch("cities.json"); if (r.ok) CITIES = (await r.json()).cities; else console.warn("cities.json: " + r.status); } catch (e) { console.warn("cities.json", e); }
    $("city").innerHTML = CITIES.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
    const want = qs.get("city"), first = CITIES.some(c => c.id === want) ? want : CITIES[0].id;
    await loadCity(first, true);
    $("q").disabled = false; $("locate").disabled = false; $("city").disabled = CITIES.length < 2;
    window.__ready = true;
  } catch (err) {
    console.error(err);
    lastStatus = null; setStatus(t("load_err").replace("{e}", err.message), "err");
  }
})();
$("city").addEventListener("change", async () => {
  try { $("q").value = ""; await loadCity($("city").value, false); writeHash(); }
  catch (err) { console.error(err); lastStatus = null; setStatus(t("load_err").replace("{e}", err.message), "err"); }
});
